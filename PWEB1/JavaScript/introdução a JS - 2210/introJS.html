<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Introdução de JavaScript</title>
</head>
<body>
    <h1>Minha primeira página com JavaScript</h1>

    <script>
        // O javaScript será escrito aqui
        // JS é oque permite darmos interatividade e lógica de programação para uma página web
        // o JS utiliza o ; de forma opicional, porém, é uma boa prática de programação utilizalas

        //os principais funções para escrever coisas para os usuário são:
        console.log('Eu amo o 67'); // dá print de uma mensagem no console, normalmente é mais usado para debug, pois o usuário normalmente não vai acessar o console
        alert('Eu adoro o calma calabreso'); // dá um alerta na tela do user, na parte superior
        document.write('Eu amo JavaScript '); // escreve uma mensagem no corpo da página, como se fosse a tag <p> do html
    </script>

    <!-- para criar um script externo, usamos o src, com o caminho para o arquivo .js -->
    <script src="script.js"></script>
</body>
</html>
