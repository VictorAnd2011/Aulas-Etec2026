<!DOCTYPE HTML>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Aula12.2</title>

    <style>
        .card {
            width: 300px;
            border: 1px solid #ddd;
            overflow: hidden;
            border-radius: 8px;
        }

        .card-header {
            background-color: #1c293b;
        }

        .card-header img {
            width: 100%;
            height: 150px;
            object-fit: contain;
            /*mostra a imagem inteira sem cortar*/
            display: block;
            /*Remove espaço inferior*/
        }

        .card-body {
            padding: 15px;
            /*Espaçamento interno*/
        }

        .btn-acao {
            background-color: #e67e22;
            color: white;
            padding: 8px;
            display: block;
            text-align: center;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>

</head>

<body>
    <div class="card">
        <div class="card-header">
            <img src="Netflix.jpg" alt="Imagem do produto Netflix">
        </div>
        <div class="card-body">
            <h3>Produto Premium</h3>
            <p>Aplicativo de streaming, que contem filmes e séries de todos os genêros</p>
            <a href="https://www.netflix.com/br/" class="btn-acao">Comprar Agora</a>
        </div>
    </div>
</body>

</html>
