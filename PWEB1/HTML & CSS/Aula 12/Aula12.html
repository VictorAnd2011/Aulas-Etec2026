<!DOCTYPE HTML>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Aula12</title>

    <Style>
        .Caixa-central {
            width: 80%;
            max-width: 600px;
            margin: 50px auto;
            background-color: #ffffff;
            padding: 20px;
            border: 2px solid #3b82f6;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </Style>

</head>

<body>
    <div class="Caixa-central">
        <h2>Título dentro da DIV</h2>
        <p>Esta div agrupa o título e o parágrafo, permitindo em centralizemos
            tudo de uma vez.</p>
    </div>

</body>

</html>
