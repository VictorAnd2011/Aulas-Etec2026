<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <title>Aula 9-Tabelas</title>
</head>
<body>
    <table border="1">
        <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Profissão</th>
        </tr>
        <tr>
            <td>Maria</td>
            <td>28</td>
            <td>Designer</td>
        </tr>
        <tr>
            <td>Victor</td>
            <td>27</td>
            <td>Desenvolvedor</td>
        </tr>
    </table>

    <br>
    <h3>Usando o colspan</h3>

    <table border="1">
        <tr>
            <th>Nome</th>
            <th colspan="2">Informações de contato</th>
        </tr>
        <tr>
            <td>Maria</td>
            <td>11 968152072</td>
            <td>mariapaulatcastro@gmail.com</td>
        </tr>
    </table>

    <Br>
    <h3>Usando o rowspan</h3>
    <table border="1">
        <tr>
            <th>Nome</th>
            <th>Idade</th>
        </tr>
        <tr>
            <td rowspan="2">Maria</td>
            <td>31</td>
        </tr>
        <tr>
            <td>32</td>
        </tr>
    </table>
</body>
</html>
