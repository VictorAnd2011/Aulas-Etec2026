<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <title>Tempo</title>
<style>
table, tr, td{
    width: 50%;
    margin: 0px auto;
    border: inset 2px #069;
    border-collapse: collapse;
    font-family: Verdana, Geneva, Tahoma, sans-serif;
    text-align: center;
}

img {
height: 90px;
width: 90px;
}

th{
border: solid 1px red;
text-align: center;
background-color: #006699;
color: white;
}

.fundo_amarelo{
background-color: lightyellow;
}










</style>
</head>
<body>
<table border="1">
    <tr>
        <th>Dia</th>
        <th>Tempo</th>
        <th>Mínima</th>
        <th>Máxima</th>
    </tr>
    <tr>
        <td>Domingo</td>
        <td><img src="Nublado4.jpg"></td>
        <td>27°</td>
        <td class="fundo_amarelo">32°</td>
    </tr>
    <tr>
        <td>Segunda</td>
        <td><img src="Ensolarado.avif"></td>
        <td>27°</td>
        <td>32°</td>
    </tr>
    <tr class="fundo_amarelo">
        <td>Terça</td>
        <td><img src="Tempestade.avif"></td>
        <td>27°</td>
        <td>32°</td>
    </tr>
    <tr>
        <td>Quarta</td>
        <td><img src="Chuva2.jpg"></td>
        <td>27°</td>
        <td>32°</td>
    </tr>
</table>
</body>
</html>
